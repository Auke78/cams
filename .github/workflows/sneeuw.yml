name: Sneeuwhoogte bijwerken

on:
  schedule:
    - cron: "17 */3 * * *"   # elke 3 uur
  workflow_dispatch:          # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sneeuwhoogte ophalen
        run: python sneeuw.py
      - name: Wijzigingen opslaan
        run: |
          if [ -n "$(git status --porcelain sneeuw.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add sneeuw.json
            git commit -m "Sneeuwhoogte bijgewerkt"
            git push
          else
            echo "Geen wijzigingen"
          fi
